<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Alex Carter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html">Profile</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="contact.html" class="active">Contact</a>
</nav>

<div class="page" style="max-width: 480px;">
  <div class="page-header">
    <h1>Get in touch</h1>
    <p>Have a project in mind? Send a message below.</p>
  </div>

  <div class="contact-layout">
    <form id="contact-form">
      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
      <p class="form-status" id="form-status"></p>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
